# OpenMontage nginx 主配置（Windows 本机开发环境）
#
# 启动方式（在 OpenMontage/nginx 下运行，使所有相对路径落在本目录）：
#   C:\tools\nginx-1.31.3\nginx.exe -p C:/Users/Admin/OpenMontage/nginx -c C:/Users/Admin/OpenMontage/nginx/nginx.conf
# 重载：nginx.exe -p <同上> -c <同上> -s reload
# 停止：nginx.exe -p <同上> -c <同上> -s quit

worker_processes  auto;

error_log  C:/Users/Admin/OpenMontage/nginx/logs/error.log  warn;
pid        C:/Users/Admin/OpenMontage/nginx/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # 复用已安装 nginx 自带的 mime.types
    include       C:/tools/nginx-1.31.3/conf/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  C:/Users/Admin/OpenMontage/nginx/logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    # gzip（全局）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 启用的站点（把 sites-available 里的 .conf 复制/链接到 sites-enabled 即生效）
    include C:/Users/Admin/OpenMontage/nginx/sites-enabled/*.conf;
    # 通用片段
    include C:/Users/Admin/OpenMontage/nginx/conf.d/*.conf;
}
